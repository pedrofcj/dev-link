[package]
name = "dev-link"
version = "0.1.0"
edition = "2021"
description = "Externalize gitignored docs to a central repo via links"

[[bin]]
name = "dev-link"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dunce = "1"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
